name: Build Imposter Party APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ImposterPartyAPKProject-phone-build.zip
          find ImposterPartyAPKProject -maxdepth 5 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ImposterPartyAPKProject
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imposter-party-debug-apk
          path: ImposterPartyAPKProject/app/build/outputs/apk/debug/app-debug.apk
