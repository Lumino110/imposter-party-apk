
name: Build Imposter Party APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _apk_project
              unzip -oq "$ZIP_FILE" -d _apk_project
            fi
            SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Android project settings file not found."
              find . -maxdepth 6 -type f | sort
              exit 2
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            find "$PROJECT_DIR" -maxdepth 5 -type f | sort
            exit 2
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imposter-party-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
